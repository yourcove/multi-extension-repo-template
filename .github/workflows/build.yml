name: Build and Release Extensions

on:
  pull_request:
    branches: [main]
  push:
    tags:
      - 'example-ui/v*'
      - 'example-downloader/v*'
      - 'example-scraper/v*'

env:
  DOTNET_VERSION: '10.0.x'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        extension:
          - name: ExampleUi
            id: com.example.ui
            path: extensions/ExampleUi
            tag-prefix: example-ui/
          - name: ExampleDownloader
            id: com.example.downloader
            path: extensions/ExampleDownloader
            tag-prefix: example-downloader/
          - name: ExampleScraper
            id: com.example.scraper
            path: extensions/ExampleScraper
            tag-prefix: example-scraper/

    steps:
      - name: Check tag match
        id: check
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "match=true" >> "$GITHUB_OUTPUT"
            echo "version=0.0.0" >> "$GITHUB_OUTPUT"
          else
            TAG="${GITHUB_REF#refs/tags/}"
            if [[ "$TAG" == "${{ matrix.extension.tag-prefix }}"* ]]; then
              echo "match=true" >> "$GITHUB_OUTPUT"
              echo "version=${TAG#${{ matrix.extension.tag-prefix }}v}" >> "$GITHUB_OUTPUT"
            else
              echo "match=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - uses: actions/checkout@v6
        if: steps.check.outputs.match == 'true'

      - name: Setup .NET
        if: steps.check.outputs.match == 'true'
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        if: steps.check.outputs.match == 'true'
        run: dotnet restore ${{ matrix.extension.path }} -p:UseLocalCovePlugins=false -p:UseLocalCoveCore=false

      - name: Build
        if: steps.check.outputs.match == 'true'
        run: dotnet build ${{ matrix.extension.path }} -c Release --no-restore -p:UseLocalCovePlugins=false -p:UseLocalCoveCore=false

      - name: Publish
        if: steps.check.outputs.match == 'true'
        run: dotnet publish ${{ matrix.extension.path }} -c Release -o artifacts/${{ matrix.extension.name }} --no-build -p:UseLocalCovePlugins=false -p:UseLocalCoveCore=false

      - name: Copy manifest
        if: steps.check.outputs.match == 'true'
        run: cp ${{ matrix.extension.path }}/extension.json artifacts/${{ matrix.extension.name }}/

      - name: Package
        if: steps.check.outputs.match == 'true' && github.event_name != 'pull_request'
        shell: bash
        run: |
          cd artifacts/${{ matrix.extension.name }}
          zip -r ../../${{ matrix.extension.id }}-${{ steps.check.outputs.version }}.zip .

      - name: Upload package artifact
        if: steps.check.outputs.match == 'true' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.extension.id }}
          path: ${{ matrix.extension.id }}-*.zip

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          files: '*.zip'
          generate_release_notes: true